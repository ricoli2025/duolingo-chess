<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101820">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="棋盘助手">
  <title>Duolingo 棋盘助手</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">STOCKFISH 19 · 本地计算</p>
        <h1>棋盘助手</h1>
      </div>
      <span class="strength">高强度</span>
    </header>

    <section class="intro">
      <p>选择一张 Duolingo 对局截图，识别棋盘后计算下一步。</p>
    </section>

    <div class="primary-actions">
      <label class="button primary" for="screenshot-input">选择对局截图</label>
      <input id="screenshot-input" type="file" accept="image/png,image/jpeg,image/webp" hidden>
    </div>

    <section id="preview-section" class="preview-section" hidden>
      <canvas id="screenshot-preview" aria-label="所选截图预览"></canvas>
    </section>

    <p id="status" class="status" role="status">截图只在这台设备上处理，不会上传。</p>

    <section id="position-section" hidden>
      <div class="section-heading">
        <h2>识别结果</h2>
        <span id="confidence" class="confidence"></span>
      </div>
      <div id="board" class="board" role="grid" aria-label="识别出的棋盘"></div>

      <div class="controls">
        <label>下方执子
          <select id="orientation">
            <option value="white">白棋</option>
            <option value="black">黑棋</option>
          </select>
        </label>
        <label>现在轮到
          <select id="turn">
            <option value="bottom">下方走</option>
            <option value="top">上方走</option>
          </select>
        </label>
        <label>王车易位
          <select id="castling">
            <option value="none">双方都不可</option>
            <option value="auto">按棋子位置允许</option>
          </select>
        </label>
      </div>

      <div class="history-note">王车易位默认禁止。只有确认本局仍可易位时，才选择“按棋子位置允许”；程序还会检查国王和车是否位于初始格。静图不设置吃过路兵。</div>
      <button id="analyze-button" class="button analyze" type="button">计算最佳着法</button>
    </section>

    <section id="result-section" class="result-section" aria-live="polite" hidden>
      <p class="eyebrow">建议着法</p>
      <div id="best-move" class="best-move"></div>
      <code id="uci-move"></code>
      <p id="engine-detail" class="hint"></p>
    </section>

    <details class="help">
      <summary>使用方法与限制</summary>
      <ol>
        <li>在 Duolingo 对局中截屏，棋盘和棋子要完整可见。</li>
        <li>回到本页选择截图，程序会自动识别棋盘。</li>
        <li>点击“计算最佳着法”，例如 <code>e2e4</code> 表示把 e2 的棋子走到 e4。</li>
      </ol>
      <p>引擎在本机运行，首次加载约需几秒。请遵守所用产品的对局规则。</p>
    </details>
  </main>
  <script>
    window.addEventListener('error', (event) => {
      const status = document.getElementById('status');
      status.textContent = `页面启动失败：${event.message || '脚本加载错误'}`;
      status.className = 'status error';
    });
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
