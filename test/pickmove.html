<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Stockfish bestmove test</title></head>
<body>
<pre id="out">running…</pre>
<script type="module">
import { StockfishEngine } from '../js/engine.js';

const out = document.getElementById('out');
window.addEventListener('error', event => { out.textContent = event.message; });
window.addEventListener('unhandledrejection', event => { out.textContent = String(event.reason); });
const lines = [];
let pass = 0;
let fail = 0;
function check(name, condition) {
  lines.push(`${condition ? 'PASS' : 'FAIL'} ${name}`);
  condition ? pass++ : fail++;
  out.textContent = lines.join('\n');
}

async function run(fen, bestMove) {
  const engine = new StockfishEngine();
  const commands = [];
  engine.initialize = async () => {};
  engine.worker = { postMessage: command => commands.push(command) };
  const pending = engine.analyze(fen, 1);
  await Promise.resolve();
  engine.handleMessage('info depth 24 multipv 2 score cp 10 pv d2d4');
  engine.handleMessage(`bestmove ${bestMove}`);
  const result = await pending;
  return { commands, result };
}

const white = await run('r3k2r/8/8/8/8/8/8/R3K2R w KQkq - 0 1', 'e1g1');
check('white bestmove is returned unchanged', white.result === 'e1g1');
check('no MultiPV option is sent', !white.commands.some(command => command.includes('MultiPV')));
check('timed search is preserved', white.commands.includes('go movetime 1'));

const black = await run('r3k2r/8/8/8/8/8/8/R3K2R b KQkq - 0 1', 'e8c8');
check('black bestmove is returned unchanged', black.result === 'e8c8');
check('no alternate PV filtering changes the result', black.result !== 'a8a1');

lines.push(`${pass} pass, ${fail} fail`);
out.textContent = lines.join('\n');
document.title = fail === 0 ? 'BESTMOVE ALL PASS' : 'BESTMOVE FAIL';
</script>
</body>
</html>
